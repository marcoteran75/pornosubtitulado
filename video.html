<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <!-- Título y meta se llenan dinámicamente con JS -->
  <title id="pageTitle">Cargando video subtitulado...</title>
  <meta name="description" id="metaDesc" content="Video porno subtitulado al español gratis.">
  <meta name="robots" content="index, follow"/>
  
  <!-- OG dinámico para cuando se comparta la página individual -->
  <meta property="og:title" id="ogTitle" content="..."/>
  <meta property="og:description" id="ogDesc" content="..."/>
  <meta property="og:type" content="video.other"/>
  <meta property="og:url" content="" id="ogUrl"/>
  <meta property="og:image" content="https://marcoteran75.github.io/subtituladosymas/imagenes/portada-video.jpg"/> <!-- imagen genérica o específica -->

  <!-- Schema dinámico para el video (mejora SEO en Google Video) -->
  <script type="application/ld+json" id="schema"></script>

  <style>
    body {
      background: linear-gradient(to bottom, #4a148c, #311b92);
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #311b92;
      padding: 1.5rem;
      text-align: center;
      border-bottom: 4px solid #7e57c2;
    }
    h1 { color: #e1bee7; margin: 0; font-size: 2.2rem; }
    nav a { color: #d1c4e9; margin: 0 1rem; text-decoration: none; font-weight: bold; }
    nav a:hover { color: #fff; }
    main {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }
    h2 {
      color: #e1bee7;
      margin: 1.5rem 0;
      font-size: 1.8rem;
    }
    iframe {
      width: 100%;
      height: 65vh; /* 65% de la altura de la ventana → se ve grande */
      min-height: 400px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .back-btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.8rem 1.8rem;
      background: #7e57c2;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    .back-btn:hover { background: #9575cd; }
  </style>
</head>
<body>

  <header>
    <h1>Porno Subtitulado</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="maduras.html">Maduras</a>
      <a href="teens.html">Teens</a>
      <a href="interracial.html">Interracial</a>
      <a href="accion.html">Acción</a>
      <a href="anime.html">Anime</a>
    </nav>
  </header>

  <main>
    <h2 id="videoTitle">Cargando...</h2>
    <iframe id="videoPlayer" allowfullscreen loading="lazy"></iframe>
    <a href="index.html" class="back-btn">← Volver a la selección</a>
  </main>

  <script>
    // Leer parámetros de la URL
    const params = new URLSearchParams(window.location.search);
    const cat = params.get('cat') || 'Categoría';
    const titleRaw = params.get('title') || 'Video subtitulado';
    const src = params.get('src') || '';
    const title = decodeURIComponent(titleRaw);

    // Actualizar título de página y encabezados
    const capitalizedCat = cat.charAt(0).toUpperCase() + cat.slice(1);
    document.getElementById('pageTitle').textContent = `${title} | Porno Subtitulado ${capitalizedCat} Español`;
    document.getElementById('videoTitle').textContent = title;

    // Cargar el iframe
    if (src) {
      document.getElementById('videoPlayer').src = src;
    } else {
      document.getElementById('videoTitle').textContent = 'Error: No se encontró el video';
    }

    // Meta description y OG dinámicos
    const desc = `Mira "${title}" subtitulado al español en categoría ${capitalizedCat}. Porno gratis con subtítulos claros.`;
    document.getElementById('metaDesc').setAttribute('content', desc);
    document.getElementById('ogTitle').setAttribute('content', `${title} - Porno Subtitulado`);
    document.getElementById('ogDesc').setAttribute('content', desc);
    document.getElementById('ogUrl').setAttribute('content', window.location.href);

    // Schema JSON-LD dinámico para este video
    const schemaData = {
      "@context": "https://schema.org",
      "@type": "VideoObject",
      "name": title,
      "description": desc,
      "embedUrl": src,
      "thumbnailUrl": "https://marcoteran75.github.io/subtituladosymas/imagenes/thumbnail-default.jpg", // cambia por uno real si tienes
      "uploadDate": "2026-02-01",
      "contentRating": "Adult"
    };
    document.getElementById('schema').textContent = JSON.stringify(schemaData);
  </script>

</body>
</html>
